<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقاضي - غير متصل</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0c1222 0%, #1a2235 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    p {
      color: #94a3b8;
      line-height: 1.8;
      margin-bottom: 32px;
      font-size: 16px;
    }
    
    .retry-btn {
      background: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    
    .tips {
      margin-top: 40px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .tips h3 {
      color: #10b981;
      margin-bottom: 12px;
      font-size: 14px;
    }
    
    .tips ul {
      list-style: none;
      text-align: right;
    }
    
    .tips li {
      color: #64748b;
      padding: 8px 0;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tips li::before {
      content: '✓';
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>
      لا تقلق! بياناتك محفوظة محلياً.<br>
      تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى.
    </p>
    <button class="retry-btn" onclick="location.reload()">
      🔄 إعادة المحاولة
    </button>
    
    <div class="tips">
      <h3>💡 نصائح</h3>
      <ul>
        <li>تحقق من اتصال WiFi أو البيانات</li>
        <li>بياناتك محفوظة وآمنة</li>
        <li>سيتم مزامنة البيانات عند الاتصال</li>
      </ul>
    </div>
  </div>
  
  <script>
    // التحقق من الاتصال كل 5 ثواني
    setInterval(() => {
      if (navigator.onLine) {
        location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
